<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FavGallery · 离线收藏</title>
    <!-- 静态壳资源（选文件夹时生成到 .FavGallery/resources/offline-viewer/） -->
    <link rel="stylesheet" href=".FavGallery/resources/offline-viewer/my-collection.css">
    <style>
        /* ===== 补充样式：my-collection.css 未覆盖的离线页专用元素 ===== */

        /* 平台切换栏（≥2 个平台时才显示） */
        .platform-bar {
            display: flex;
            gap: 8px;
            padding: 12px 30px;
            background: #fff;
            border-bottom: 1px solid #e8e8e8;
            flex-wrap: wrap;
        }
        .platform-btn {
            padding: 6px 16px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: #fff;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            transition: all .2s;
        }
        .platform-btn:hover { border-color: #1890ff; color: #1890ff; }
        .platform-btn.active {
            background: #1890ff;
            border-color: #1890ff;
            color: #fff;
        }

        /* 二级视图返回栏（作者详情 / 收藏夹详情） */
        .subview-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 30px;
            background: #fafafa;
            border-bottom: 1px solid #e8e8e8;
        }
        .subview-back {
            padding: 5px 14px;
            border: 1px solid #1890ff;
            border-radius: 6px;
            background: #1890ff;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all .2s;
        }
        .subview-back:hover { background: #40a9ff; border-color: #40a9ff; color: #fff; }
        .subview-title { font-size: 15px; font-weight: 500; color: #333; }
        .subview-meta { font-size: 12px; color: #999; }

        /* Tab 计数徽标 */
        .tab-count { color: #bbb; font-size: 12px; margin-left: 4px; }
        .tab-btn.active .tab-count { color: #69c0ff; }

        /* 作品卡：媒体类型 / 图集张数角标 */
        .media-type-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            color: #fff;
            background: rgba(0, 0, 0, .55);
            z-index: 11;
            user-select: none;
        }
        .media-type-badge.image-post { background: rgba(114, 46, 209, .8); }
        .media-type-badge.has-music { background: rgba(19, 194, 194, .85); }

        /* 卡片底部音频播放器 */
        .card-audio {
            width: 100%;
            margin-top: 8px;
            height: 32px;
        }

        /* 卡片操作链接 */
        .card-actions { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
        .card-link {
            font-size: 12px;
            color: #1890ff;
            text-decoration: none;
            cursor: pointer;
        }
        .card-link:hover { text-decoration: underline; }
        .card-link.disabled { color: #bfbfbf; cursor: not-allowed; text-decoration: none; }

        /* 点击放大预览：通用媒体容器 */
        .cover-preview-body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 90vw;
            max-height: 90vh;
        }
        .cover-preview-body video {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 8px;
            background: #000;
        }
        /* 图集切换按钮 */
        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, .2);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-nav:hover { background: rgba(255, 255, 255, .35); }
        .gallery-nav.prev { left: -60px; }
        .gallery-nav.next { right: -60px; }
        .gallery-counter {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 13px;
        }

        /* 触底续加载提示 */
        .load-more-hint {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 13px;
        }
    </style>

    <!-- 诊断日志（内联于此先于外部脚本执行，以捕获最早的加载/运行错误；不新增文件故无需登记 SHELL_FILES/WAR）：
         file:// 无回写磁盘通道，故采用「内存环形缓冲 + localStorage 持久化 + 页内浮动面板」形态，
         保持离线页双击即用；错误不再只躺在 console，页内可见可复制。 -->
    <script>
    (function () {
        'use strict';
        var KEY = 'favGalleryDiagV1';
        var MAX = 200;
        var buf = [];
        var saveTimer = null;
        var listeners = [];

        try { var raw = localStorage.getItem(KEY); if (raw) { var a = JSON.parse(raw); if (Array.isArray(a)) buf = a; } } catch (e) {}

        function persistNow() { try { localStorage.setItem(KEY, JSON.stringify(buf.slice(-MAX))); } catch (e) {} }
        function schedulePersist() { if (saveTimer) return; saveTimer = setTimeout(function () { saveTimer = null; persistNow(); }, 1000); }
        function push(level, msg, source) {
            buf.push({ t: Date.now(), level: level, msg: String(msg == null ? '' : msg).slice(0, 500), source: source || '' });
            if (buf.length > MAX) buf.splice(0, buf.length - MAX);
            schedulePersist();
            for (var i = 0; i < listeners.length; i++) { try { listeners[i](); } catch (e) {} }
        }
        function fmtLoc(e) {
            if (!e) return '';
            var s = e.fileName || e.sourceURL || e.filename || '';
            var ln = e.lineNumber || e.line || '';
            var cl = e.colNumber || e.column || '';
            var loc = s ? (' @' + s + (ln ? ':' + ln : '') + (cl ? ':' + cl : '')) : '';
            return (e.message || '') + loc;
        }
        var resSeen = Object.create(null);
        window.addEventListener('error', function (ev) {
            var t = ev.target || ev.srcElement;
            // 资源加载失败：capture 阶段也会收到 <img>/<script>/<link> 的 error，它们不是 JS 运行时错误
            if (t && t !== window && t.tagName) {
                var tag = String(t.tagName).toLowerCase();
                if (tag === 'img') return; // 裂图离线属预期（远程封面回源失败），页内已灰底兜底，不记录
                var url = t.src || t.href || '';
                var rk = tag + '|' + url;
                if (resSeen[rk]) return; // 同一资源只记一次，避免刷屏
                resSeen[rk] = 1;
                push('warn', '资源加载失败 <' + tag + '> ' + url, 'resource');
                return;
            }
            // JS 运行时错误（有 message / 堆栈位置）
            push('error', fmtLoc(ev.error || ev) || '(无消息的运行时错误)', 'runtime');
        }, true);
        window.addEventListener('unhandledrejection', function (ev) {
            var r = ev.reason;
            push('error', (r && r.message) ? fmtLoc(r) : String(r), 'unhandledrejection');
        });

        var diag = {
            log: function (m, s) { push('log', m, s || 'app'); },
            warn: function (m, s) { push('warn', m, s || 'app'); },
            error: function (m, s) { push('error', m, s || 'app'); },
            entries: function () { return buf; },
            clear: function () { buf = []; try { localStorage.removeItem(KEY); } catch (e) {} for (var i = 0; i < listeners.length; i++) { try { listeners[i](); } catch (e) {} } },
            copyAll: function () {
                var text = buf.map(function (e) { return new Date(e.t).toISOString() + ' [' + e.level + '] ' + (e.source ? '(' + e.source + ') ' : '') + e.msg; }).join('\n');
                try {
                    var ta = document.createElement('textarea');
                    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
                    document.body.appendChild(ta); ta.focus(); ta.select();
                    var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
                } catch (e) { return false; }
            },
            onChange: function (fn) { listeners.push(fn); }
        };
        window.__favGalleryDiag = diag;

        function build() {
            if (document.getElementById('fgDiagFab')) return;
            var fab = document.createElement('div');
            fab.id = 'fgDiagFab'; fab.className = 'fg-diag-fab'; fab.title = '离线页诊断日志'; fab.textContent = '\ud83d\udc1e 0';
            var panel = document.createElement('div');
            panel.id = 'fgDiagPanel'; panel.className = 'fg-diag-panel'; panel.style.display = 'none';
            panel.innerHTML =
                '<div class="fg-diag-head"><span class="fg-diag-title">诊断日志</span>' +
                '<span class="fg-diag-sub" id="fgDiagSub"></span><span class="fg-diag-sp"></span>' +
                '<button class="fg-diag-btn" id="fgDiagCopy">复制</button>' +
                '<button class="fg-diag-btn" id="fgDiagClear">清空</button>' +
                '<button class="fg-diag-btn fg-diag-close" id="fgDiagClose">\u00d7</button></div>' +
                '<div class="fg-diag-list" id="fgDiagList"></div>';
            document.body.appendChild(fab); document.body.appendChild(panel);

            function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
            function paint() {
                var n = buf.length, errN = 0;
                for (var i = 0; i < buf.length; i++) if (buf[i].level === 'error') errN++;
                fab.textContent = '\ud83d\udc1e ' + n;
                fab.className = 'fg-diag-fab' + (errN ? ' has-error' : '') + (panel.style.display !== 'none' ? ' active' : '');
                var sub = document.getElementById('fgDiagSub');
                if (sub) sub.textContent = n + ' 条' + (errN ? ' · ' + errN + ' 错误' : '') + '（本地持久化）';
                var list = document.getElementById('fgDiagList'); if (!list) return;
                var html = '';
                for (var j = buf.length - 1; j >= 0; j--) {
                    var e = buf[j];
                    html += '<div class="fg-diag-row lvl-' + e.level + '">' +
                        '<span class="fg-diag-time">' + new Date(e.t).toLocaleTimeString('zh-CN') + '</span>' +
                        '<span class="fg-diag-lvl">' + e.level + '</span>' +
                        (e.source ? '<span class="fg-diag-src">' + esc(e.source) + '</span>' : '') +
                        '<span class="fg-diag-msg">' + esc(e.msg) + '</span></div>';
                }
                list.innerHTML = html || '<div class="fg-diag-empty">暂无记录</div>';
            }
            fab.addEventListener('click', function () { panel.style.display = panel.style.display === 'none' ? 'flex' : 'none'; paint(); });
            document.getElementById('fgDiagClose').addEventListener('click', function () { panel.style.display = 'none'; paint(); });
            document.getElementById('fgDiagClear').addEventListener('click', function () { diag.clear(); });
            document.getElementById('fgDiagCopy').addEventListener('click', function () {
                var ok = diag.copyAll(); var b = document.getElementById('fgDiagCopy');
                b.textContent = ok ? '已复制' : '失败'; setTimeout(function () { b.textContent = '复制'; }, 1200);
            });
            diag.onChange(paint);
            paint();
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build); else build();
    })();
    </script>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>FavGallery</h1>
            <div class="subtitle" id="subtitle">离线收藏浏览</div>
        </div>

        <!-- 加载态 -->
        <div class="loading-state" id="loading">
            <div class="spinner"></div>
            <div>正在加载离线数据…</div>
        </div>

        <!-- 错误 / 引导态 -->
        <div id="errorContainer" style="display:none;"></div>

        <!-- 主内容（数据就绪后显示） -->
        <div id="content" style="display:none;">
            <!-- 平台栏（≥2 平台才渲染） -->
            <div class="platform-bar" id="platformBar" style="display:none;"></div>

            <!-- 二级视图返回栏（作者详情 / 收藏夹详情时显示） -->
            <div class="subview-bar" id="subViewBar" style="display:none;">
                <button class="subview-back" id="subViewBack">← 返回</button>
                <span class="subview-title" id="subViewTitle"></span>
                <span class="subview-meta" id="subViewMeta"></span>
            </div>

            <!-- 搜索（多关键词小卡片：回车/逗号固化，可单独删除；分片内命中任意词，全局搜索命中全部词） -->
            <div class="search-container">
                <div class="search-box" id="searchBox">
                    <span class="search-chips" id="searchChips"></span>
                    <input type="text" class="search-input" id="searchInput"
                           placeholder="搜索当前列表（描述 / 作者 / 收藏夹）；回车或逗号可追加关键词">
                </div>
            </div>

            <!-- 筛选 / 每页 / 时间 / 排序 -->
            <div class="filter-sort-toolbar">
                <div class="filter-groups">
                    <div class="filter-section">
                        <span class="label">筛选</span>
                        <label class="filter-item"><input type="radio" name="filter" value="all" checked> 全部</label>
                        <label class="filter-item"><input type="radio" name="filter" value="downloaded"> 已保存</label>
                        <label class="filter-item"><input type="radio" name="filter" value="notDownloaded"> 未保存</label>
                    </div>
                    <!-- 作品类型（仅作品视图显示，显隐由 JS 控制）：样式与保存状态一致的单选组 -->
                    <div class="type-filter-section" id="typeFilterSection" style="display:none;">
                        <span class="label">类型</span>
                        <label class="filter-item"><input type="radio" name="workType" value="all" checked> 全部</label>
                        <label class="filter-item"><input type="radio" name="workType" value="video"> 视频</label>
                        <label class="filter-item"><input type="radio" name="workType" value="image"> 图集</label>
                    </div>
                    <!-- 时长（仅作品视图且类型为视频时可用）：多选档位，命中任一所选即显示 -->
                    <div class="duration-filter-section is-disabled" id="durationFilterSection" style="display:none;" title="仅“视频”类型可按时长筛选">
                        <span class="label">时长</span>
                        <label class="filter-item"><input type="checkbox" name="duration" value="le15" disabled> ≤15秒</label>
                        <label class="filter-item"><input type="checkbox" name="duration" value="s15to60" disabled> 15~60秒</label>
                        <label class="filter-item"><input type="checkbox" name="duration" value="m1to3" disabled> 1~3分钟</label>
                        <label class="filter-item"><input type="checkbox" name="duration" value="m3to10" disabled> 3~10分钟</label>
                        <label class="filter-item"><input type="checkbox" name="duration" value="m10to30" disabled> 10~30分钟</label>
                        <label class="filter-item"><input type="checkbox" name="duration" value="m30to60" disabled> 30~60分钟</label>
                        <label class="filter-item"><input type="checkbox" name="duration" value="gt60" disabled> &gt;60分钟</label>
                        <button class="date-clear" id="durationClear" title="清除时长筛选" style="display:none;">✕</button>
                    </div>
                </div>
                <div class="toolbar-right">
                    <div class="date-filter-section" id="dateFilterSection" style="display:none;">
                        <span class="label">时间</span>
                        <input type="date" class="date-input" id="dateFrom" title="起始日期">
                        <span class="date-sep">~</span>
                        <input type="date" class="date-input" id="dateTo" title="结束日期">
                        <button class="date-clear" id="dateClear" title="清除时间筛选">✕</button>
                    </div>
                    <div class="pagesize-section" id="pageSizeSection">
                        <span class="label">每页</span>
                        <select class="pagesize-select" id="pageSizeSelect">
                            <option value="20">20</option>
                            <option value="40">40</option>
                            <option value="60" selected>60</option>
                            <option value="120">120</option>
                            <option value="240">240</option>
                        </select>
                    </div>
                    <!-- 分页条：从列表底部移到工具栏，位于「每页」与「排序」之间；仅作品视图显示 -->
                    <div class="pager" id="pager" style="display:none;"></div>
                    <div class="sort-section" title="时间・保存状态可叠加：先勾选的为主键，后勾选的为次级键；点方框=启用/停用，点文本或箭头=切换升/降序">
                        <span class="label">排序</span>
                        <span class="sort-item">
                            <input type="checkbox" id="sortByTime" checked title="启用/停用时间排序">
                            <span class="sort-text" id="sortTextTime">时间</span>
                            <button class="sort-direction" id="dirTime">↓</button>
                        </span>
                        <span class="sort-item">
                            <input type="checkbox" id="sortByStatus" title="启用/停用保存状态排序">
                            <span class="sort-text" id="sortTextStatus">保存状态</span>
                            <button class="sort-direction" id="dirStatus">↓</button>
                        </span>
                    </div>
                </div>
            </div>

            <!-- 话题筛选（可输入的多标签选择器）：输入/候选选择，回车或逗号添加，多个=OR 命中；点卡片话题 chip 也会加入 -->
            <div class="topic-filter-bar" id="topicFilterBar" style="display:none;">
                <span class="label">话题</span>
                <div class="topic-tag-input" id="topicTagInput">
                    <span class="topic-chips" id="topicChips"></span>
                    <input type="text" class="topic-input" id="topicInput" list="topicPool" autocomplete="off"
                           placeholder="输入或选择话题筛选，回车/逗号添加（多个话题=任一命中 OR）">
                    <datalist id="topicPool"></datalist>
                </div>
                <button class="topic-clear" id="topicClear" title="清除全部话题筛选" style="display:none;">✕ 清除</button>
            </div>

            <!-- 列表类型 Tab -->
            <div class="tab-nav" id="tabNav">
                <button class="tab-btn active" data-tab="liked">点赞<span class="tab-count" id="countLiked"></span></button>
                <button class="tab-btn" data-tab="bookmarked">收藏夹<span class="tab-count" id="countBookmarked"></span></button>
                <button class="tab-btn" data-tab="authors">作者<span class="tab-count" id="countAuthors"></span></button>
            </div>

            <!-- Tab 内容 -->
            <div class="tab-content">
                <!-- 点赞 -->
                <div class="tab-pane active" id="pane-liked">
                    <div class="list" id="list-liked"></div>
                    <div class="load-more-hint" id="more-liked" style="display:none;"></div>
                    <div class="empty-state" id="empty-liked" style="display:none;">暂无点赞作品</div>
                </div>
                <!-- 收藏夹（一级：收藏夹清单；二级：单收藏夹作品） -->
                <div class="tab-pane" id="pane-bookmarked">
                    <div class="list" id="list-bookmarked"></div>
                    <div class="empty-state" id="empty-bookmarked" style="display:none;">暂无收藏夹</div>
                </div>
                <!-- 作者（一级：作者列表；二级：单作者作品） -->
                <div class="tab-pane" id="pane-authors">
                    <div class="list" id="list-authors"></div>
                    <div class="empty-state" id="empty-authors" style="display:none;">暂无作者</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 封面悬浮预览（跟随鼠标的小图） -->
    <div class="cover-hover-preview" id="coverHoverPreview">
        <img id="hoverPreviewImg" src="" alt="">
    </div>

    <!-- 点击放大预览（承载 图片 / 视频 / 图集 / 音频） -->
    <div class="cover-preview-overlay" id="coverPreviewOverlay">
        <button class="cover-preview-close" id="coverPreviewClose" title="关闭">×</button>
        <div class="cover-preview-body" id="coverPreviewBody"></div>
    </div>

    <!-- 经典脚本（file:// 不支持 ES module）：core → features → index -->
    <script src=".FavGallery/resources/offline-viewer/core.js"></script>
    <script src=".FavGallery/resources/offline-viewer/features.js"></script>
    <script src=".FavGallery/resources/offline-viewer/index.js"></script>

    <!-- 首屏看门狗：不依赖外部 JS。若静态壳/离线数据缺失（如首次使用尚未选文件夹、
         或选完文件夹后台仍在生成），外部 JS 加载失败会导致 #loading 无限转圈；
         超时后强制展示友好的首次使用引导。 -->
    <script>
    (function () {
        var WATCHDOG_MS = 6000;
        function guideHtml() {
            return '<div class="error-message" style="text-align:center;">' +
                '<div style="font-size:40px;line-height:1;margin-bottom:12px;">👋</div>' +
                '<h2 style="margin:0 0 10px;font-size:18px;color:#333;">欢迎使用 FavGallery 离线收藏页</h2>' +
                '<p style="color:#666;line-height:1.7;margin:0 0 8px;">还没有找到可展示的离线数据，常见原因：</p>' +
                '<ol style="color:#666;line-height:1.9;text-align:left;margin:0 auto 14px;max-width:440px;padding-left:20px;">' +
                '<li>你还没有在扩展中<b>选择本地文件夹</b>；</li>' +
                '<li>刚选完文件夹，数据正在后台<b>生成中</b>（首次生成需数秒到数十秒）。</li>' +
                '</ol>' +
                '<p style="color:#333;line-height:1.9;margin:0 auto 14px;max-width:460px;">请依次操作：打开抖音 / 小红书页面 → 在 FavGallery 侧边栏点击<b>「选择文件夹」</b> → 等待扩展提示生成完成 → <b>刷新本页</b>。</p>' +
                '<span style="color:#999;font-size:12px;">期望数据路径：<code>.FavGallery/metadata/offline-index.js</code></span>' +
                '</div>';
        }
        // 暴露给外部 index.js 复用，保证两条路径文案一致
        window.__favGalleryGuideHtml = guideHtml;
        setTimeout(function () {
            var loading = document.getElementById('loading');
            var content = document.getElementById('content');
            var errBox = document.getElementById('errorContainer');
            var loadingVisible = loading && loading.style.display !== 'none';
            var contentVisible = content && content.style.display === 'block';
            var errShown = errBox && errBox.style.display === 'block' && errBox.innerHTML.trim() !== '';
            if (loadingVisible && !contentVisible && !errShown) {
                if (loading) loading.style.display = 'none';
                if (errBox) { errBox.style.display = 'block'; errBox.innerHTML = guideHtml(); }
            }
        }, WATCHDOG_MS);
    })();
    </script>
</body>
</html>
